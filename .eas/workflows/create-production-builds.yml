# Builds iOS + Android in parallel. Submit jobs run after each platform build when store credentials are configured in EAS (see .eas/STORE_SUBMIT.md).
name: Create Production Builds

jobs:
  build_ios:
    type: build
    workingDirectory: mobile
    params:
      platform: ios
      profile: production

  build_android:
    type: build
    workingDirectory: mobile
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit Android to Google Play
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
