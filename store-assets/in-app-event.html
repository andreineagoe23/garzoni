<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--BASE-->
    <title>App Store In-App Event media</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Apple: no text or logos in event media — the App Store overlays the event name,
         badge, description and app icon along the bottom. Art sits in the upper part. */
      .ev-art {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }
      .card .ev-art {
        top: 7vh;
        width: 52vw;
      }
      .details .ev-art {
        top: 9vh;
        width: 88vw;
      }
      .trail {
        fill: none;
        stroke: rgba(var(--brand-text-rgb), 0.28);
        stroke-width: 3;
        stroke-dasharray: 2 9;
        stroke-linecap: round;
      }
      .ridge {
        fill: url(#ridge);
      }
      .done {
        fill: var(--brand-green);
        stroke: rgba(var(--brand-text-rgb), 0.35);
        stroke-width: 2;
      }
      .tick {
        fill: none;
        stroke: var(--brand-text);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .now {
        fill: var(--brand-gold-warm);
      }
      .now-ring {
        fill: none;
        stroke: var(--brand-gold-warm);
        stroke-width: 2.5;
        opacity: 0.45;
      }
      .next {
        fill: var(--brand-bg-card);
        stroke: rgba(var(--brand-text-rgb), 0.3);
        stroke-width: 2;
      }
      .flag {
        fill: var(--brand-gold-warm);
      }
      .pole {
        stroke: rgba(var(--brand-text-rgb), 0.7);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
    </style>
  </head>
  <body class="fg">
    <script id="slot-data" type="application/json">
      { "layout": "card" }
    </script>

    <!-- Seven days up The Climb: three done, today, three to go, the summit flag -->
    <svg class="ev-art" viewBox="0 -10 400 310" aria-hidden="true">
      <defs>
        <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: rgb(var(--brand-green-rgb)); stop-opacity: 0.5" />
          <stop offset="1" style="stop-color: rgb(var(--brand-green-rgb)); stop-opacity: 0" />
        </linearGradient>
        <linearGradient id="fade-x" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="white" stop-opacity="0" />
          <stop offset="0.2" stop-color="white" stop-opacity="1" />
          <stop offset="0.8" stop-color="white" stop-opacity="1" />
          <stop offset="1" stop-color="white" stop-opacity="0" />
        </linearGradient>
        <mask id="fade">
          <rect width="400" height="300" fill="url(#fade-x)" />
        </mask>
      </defs>
      <path class="ridge" mask="url(#fade)" d="M0 300 L95 190 L150 230 L250 110 L290 150 L345 40 L400 110 L400 300 Z" />
      <path
        class="trail"
        d="M45 270 C90 268 120 262 130 244 C142 222 92 214 96 196 C100 178 160 182 176 166 C192 150 150 134 168 118 C186 102 240 112 262 98 C284 84 262 66 288 58 C312 50 330 44 345 32"
      />
      <circle class="done" cx="45" cy="270" r="14" />
      <path class="tick" d="M38 270 l5 5 l9 -10" />
      <circle class="done" cx="130" cy="244" r="14" />
      <path class="tick" d="M123 244 l5 5 l9 -10" />
      <circle class="done" cx="96" cy="196" r="14" />
      <path class="tick" d="M89 196 l5 5 l9 -10" />
      <circle class="now-ring" cx="176" cy="166" r="24" />
      <circle class="now" cx="176" cy="166" r="16" />
      <circle class="next" cx="168" cy="118" r="12" />
      <circle class="next" cx="262" cy="98" r="12" />
      <circle class="next" cx="345" cy="32" r="12" />
      <line class="pole" x1="345" y1="20" x2="345" y2="-6" />
      <path class="flag" d="M345 -5 L366 2 L345 9 Z" />
    </svg>

    <script>
      const d = JSON.parse(document.getElementById("slot-data").textContent);
      document.body.classList.add(d.layout);
    </script>
  </body>
</html>
